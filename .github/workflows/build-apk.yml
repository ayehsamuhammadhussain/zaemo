name: Build ZAEMO APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run prepare:web
      - run: npx cap add android
      - run: node android-setup.mjs
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ZAEMO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZAEMO-1.0.0-apk
          path: ZAEMO.apk
      - name: Publish release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ZAEMO 1.0.0
          body: ZAEMO Android app. Download ZAEMO.apk below and open it on your phone (allow installing from this source).
          files: ZAEMO.apk
          make_latest: true
